<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Inventario{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'inventario/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="">Inventario</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>    
            
            {% if show_inicio %}
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <a class="navbar-brand" href="{% url 'index' %}"><button class="btn btn-outline-light" type="button">Inicio</button></a>
            </div>
            {% endif %}
            {% if user.is_authenticated %}
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <a class="navbar-brand" href="{% url 'articulos' %}"><button class="btn btn-outline-light" type="button">Ver lista</button></a>
                </div>
                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-outline-danger" type="submit">Cerrar sesión</button>
                </form>
            {% endif %}

        </div>
    </nav>

    <!-- Contenido dinámico -->
    <main class="container mt-5 contenido">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pie de página -->
    <footer class="bg-dark text-white text-center p-3 mt-5">
        <p>&copy; 2025 Inventario.C - Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
